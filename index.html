<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>table-main</title>
  </head>
  <body>
    <button style="background-color: red">
      <a href="html-var/red.html">Red</a>
    </button>
    <button style="background-color: green">
      <a href="html-var/green.html">Green</a>
    </button>
    <button style="background-color: blue">
      <a href="html-var/blue.html">Blue</a>
    </button>
    <button style="background-color: yellow">
      <a href="html-var/yellow.html">Yellow</a>
    </button>
    <div id="github-container">
      <a href="https://github.com/tomal-khan" target="_blank">
        <img src="./assets/img/github.png" alt="github-logo" />
        <span>github</span>
      </a>
    </div>
  </body>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: white;
      font-family: Verdana, sans-serif;
    }
    button {
      margin: 10px;
      padding: 15px 30px;
      border: none;
      border-radius: 10px;
      background-color: white;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: scale(1.1);
    }

    a {
      text-decoration: none;
      color: black;
      font-size: 18px;
      font-weight: bold;
    }
    #github-container {
      position: absolute;
      bottom: 10px;
      right: 10px;
    }
    #github-container a {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #github-container img {
      width: 50px;
    }
    #github-container span {
      font-size: 25px;
    }
  </style>
</html>
