<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>table-red</title>
    <link rel="stylesheet" href="./assets/style/style.css" />
  </head>
  <body>
    <div class="container">
      <table>
        <thead>
          <tr>
            <th class="col1">SL No.</th>
            <th class="col2">Client Name</th>
            <th class="col3">Company</th>
            <th class="col4">Tender</th>
            <th class="col5">Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="col1">1</td>
            <td class="col2">Paul</td>
            <td class="col3">YellowCab</td>
            <td class="col4">Fleet Maint</td>
            <td class="col5">Active</td>
          </tr>
          <tr>
            <td class="col1">2</td>
            <td class="col2">Quinn</td>
            <td class="col3">FastTrack</td>
            <td class="col4">Railway Exp</td>
            <td class="col5">Pending</td>
          </tr>
          <tr>
            <td class="col1">3</td>
            <td class="col2">Ryan</td>
            <td class="col3">GoldMine</td>
            <td class="col4">Excavation</td>
            <td class="col5">Completed</td>
          </tr>
          <tr>
            <td class="col1">4</td>
            <td class="col2">Sofia</td>
            <td class="col3">SunBuild</td>
            <td class="col4">Bridge Const</td>
            <td class="col5">In Progress</td>
          </tr>
          <tr>
            <td class="col1">5</td>
            <td class="col2">Tom</td>
            <td class="col3">BrightLight</td>
            <td class="col4">Street Lamps</td>
            <td class="col5">Review</td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
  <style>
    body {
      background-color: #fdffe6;
      font-family: Verdana;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 30px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5);
    }

    table,
    th,
    td {
      border: 1px solid black;
      border-collapse: collapse;
      padding: 10px 20px;
    }

    th {
      font-family: verdana;
    }

    td {
      font-family: courier;
    }

    ::selection {
      background-color: #f9ffba;
      color: black;
    }

    /* hover */

    tr:hover {
      background-color: #fdffe6;
    }

    table:has(.col1:hover) .col1:not(:hover),
    table:has(.col2:hover) .col2:not(:hover),
    table:has(.col3:hover) .col3:not(:hover),
    table:has(.col4:hover) .col4:not(:hover),
    table:has(.col5:hover) .col5:not(:hover) {
      background-color: #fdffe6;
    }

    .col1:hover,
    .col2:hover,
    .col3:hover,
    .col4:hover,
    .col5:hover {
      background-color: #f9ffba;
    }
  </style>
</html>
