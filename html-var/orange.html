<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>table-orange</title>
    <link rel="stylesheet" href="./assets/style/style.css" />
  </head>
  <body>
    <div class="container">
      <table>
        <thead>
          <th class="col1">SL No.</th>
          <th class="col2">Client Name</th>
          <th class="col3">Company</th>
          <th class="col4">Tender</th>
          <th class="col5">Status</th>
        </thead>
        <tbody>
          <tr>
            <td class="col1">1</td>
            <td class="col2">Liam</td>
            <td class="col3">Sunrise Corp</td>
            <td class="col4">Solar Energy</td>
            <td class="col5">Active</td>
          </tr>
          <tr class="tr-">
            <td class="col1">2</td>
            <td class="col2">Mason</td>
            <td class="col3">Amber Logistics</td>
            <td class="col4">Shipping</td>
            <td class="col5">Pending</td>
          </tr>
          <tr>
            <td class="col1">3</td>
            <td class="col2">Nora</td>
            <td class="col3">Citrus Systems</td>
            <td class="col4">Software</td>
            <td class="col5">Completed</td>
          </tr>
          <tr class="tr-">
            <td class="col1">4</td>
            <td class="col2">Oscar</td>
            <td class="col3">Flame Inc</td>
            <td class="col4">Heating</td>
            <td class="col5">In Progress</td>
          </tr>
          <tr>
            <td class="col1">5</td>
            <td class="col2">Piper</td>
            <td class="col3">Coral Designs</td>
            <td class="col4">Architecture</td>
            <td class="col5">Review</td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
  <style>
    body {
      background-color: #fff5e6;
      font-family: Verdana;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 30px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5);
    }

    th,
    td,
    .td- {
      border-radius: 5px;
      padding: 5px 10px;
      box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.5);
    }

    th:hover,
    td:hover,
    .td-:hover,
    tr:hover,
    .tr-:hover {
      /* row hover */
      border: 1px solid #000000;
      outline: 0.01px solid #000000;
      background-color: #fff4e8;
      transition: transform 0.2s;
    }

    th:hover,
    td:hover,
    .td-:hover,
    tr:hover,
    .tr-:hover {
      transform: scale(1.01);
    }

    /* selection */
    table::selection {
      background-color: #ffffff13;
      color: #ffcb8f;
    }

    table:has(.col1:hover) .col1:not(:hover),
    table:has(.col2:hover) .col2:not(:hover),
    table:has(.col3:hover) .col3:not(:hover),
    table:has(.col4:hover) .col4:not(:hover),
    table:has(.col5:hover) .col5:not(:hover) {
      /* column hover */
      background-color: #fff4e8;
    }

    .col1:hover,
    .col2:hover,
    .col3:hover,
    .col4:hover,
    .col5:hover {
      /* column hover */
      background-color: #ffcb8f; /* data hover */
    }
  </style>
</html>
